name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform_name: Linux
          - os: macos-latest
            platform_name: macOS

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync

    - name: Build binary
      run: |
        PYTHONPATH=src make build

    - name: Test binary
      run: |
        ./dist/s2s --help || echo "No help flag, checking version"
        file dist/s2s

    - name: Create distribution package
      run: |
        make dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: s2s-${{ runner.os }}-${{ runner.arch }}
        path: dist/s2s-*.tar.gz

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/s2s-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
